{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Storage Manager{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">Storage Manager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
              aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
        <div class="navbar-nav gap-2">
          {% if user.is_authenticated %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'video_library' %}">Videos</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'bin' %}">Bin</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'upload' %}">Upload</a>
            <a class="btn btn-warning btn-sm" href="{% url 'logout' %}">Logout</a>
          {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
  <main class="container mb-5">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'storage/js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
